<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f7f6f1">
<title>バトルデモ | 打鍵戦線</title>
<style>
  :root {
    color-scheme: light;
    --paper: #f7f6f1;
    --sheet: #fffefa;
    --ink: #25223a;
    --muted: #61596e;
    --rule: #dfd9e7;
    --purple: #4a36ba;
    --soft: #ece6ff;
    --mono: "Cascadia Mono", "Consolas", monospace;
    font-family: "BIZ UDPGothic", "Hiragino Kaku Gothic ProN", "Yu Gothic UI", "Meiryo", sans-serif;
    color: var(--ink);
    background: var(--paper);
  }
  * { box-sizing: border-box; }
  body, h1, h2, h3, p, figure, ol, ul, dl, dd { margin: 0; }
  [hidden] { display: none !important; }
  button, select { font: inherit; color: inherit; }
  button:not(:disabled), select:not(:disabled) { cursor: pointer; }
  caption, label, output { color: inherit; }
  :focus-visible { outline: 3px solid #7258e2; outline-offset: 3px; }
  .wrap { max-width: 1430px; margin: 0 auto; padding-inline: clamp(14px, 3.2vw, 46px); }
  .bar { background: var(--sheet); border-bottom: 1px solid var(--rule); }
  .bar .wrap { display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 61px; }
  .brand { display: flex; align-items: center; gap: 10px; font-size: 18px; font-weight: 800; white-space: nowrap; }
  .key { display: grid; place-items: center; width: 32px; height: 30px; background: var(--purple); color: white; border-radius: 8px; box-shadow: 0 3px #2a235b; font-size: 16px; }
  .nav { display: flex; align-items: center; gap: 4px; }
  .nav a { color: var(--muted); font-size: 12px; font-weight: 700; padding: 8px 9px; border-radius: 7px; text-decoration: none; white-space: nowrap; }
  .nav a:hover, .nav a[aria-current] { color: var(--purple); background: var(--soft); }
  main.wrap { padding-bottom: 30px; }
  .intro { display: flex; justify-content: space-between; align-items: end; gap: 12px; padding-block: 22px 15px; }
  h1 { font-size: clamp(31px, 4vw, 52px); letter-spacing: -.055em; line-height: 1.07; font-weight: 800; }
  .intro p { color: var(--muted); margin-top: 7px; font-size: 13px; }
  .tools { display: flex; align-items: end; gap: 6px; flex-wrap: wrap; }
  .tools label { display: inline-flex; align-items: center; gap: 5px; color: var(--muted); font-size: 11px; font-weight: 700; }
  .button, .tools select, .plans select, .custom select {
    min-height: 38px; border: 1px solid #ddd5e5; border-radius: 8px;
    padding-inline: 11px; color: var(--ink); background: var(--sheet); font-size: 12px; font-weight: 700;
  }
  .button:hover, .tools select:hover { border-color: #ac9ad5; color: var(--purple); }
  .button:disabled { cursor: default; opacity: .5; }
  .button.primary { color: #fff; background: var(--purple); border-color: var(--purple); }
  .button.primary:hover { background: #3b299f; }
  .button.primary:focus-visible { outline-offset: 2px; }
  .settings { margin-bottom: 11px; }
  .plans, .custom-fields { display: flex; align-items: end; gap: 7px 12px; flex-wrap: wrap; }
  .plans label, .custom label { display: grid; gap: 3px; color: var(--muted); font-size: 11px; font-weight: 700; }
  .plans select { min-width: 116px; }
  .custom { margin-top: 9px; color: var(--muted); font-size: 12px; }
  .custom summary { cursor: pointer; font-weight: 700; }
  .custom-fields { margin-top: 7px; }
  .custom label { min-width: 0; flex: 1 1 138px; }
  .custom select { width: 100%; }
  #custom-error { color: #833c42; margin-top: 5px; }
  .stage { overflow: hidden; border: 1px solid #4a4560; border-radius: 16px; background: #24253e; }
  .hud { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); gap: 18px; align-items: center; padding: 12px 19px; background: #29253e; color: #fff6ec; border-bottom: 1px solid #474057; }
  .side { display: grid; gap: 4px; align-items: start; }
  .side-head { display: flex; align-items: baseline; gap: 5px 12px; justify-content: space-between; flex-wrap: wrap; }
  .side h2 { font-size: 14px; font-weight: 800; color: var(--flag); white-space: nowrap; }
  .side output { font: 700 13px/1.3 var(--mono); color: #fff4ed; white-space: nowrap; }
  .side progress { width: 100%; height: 7px; border: none; border-radius: 8px; overflow: hidden; appearance: none; color: var(--flag); background: #4a435a; }
  .side progress::-webkit-progress-bar { background: #4a435a; }
  .side progress::-webkit-progress-value { background: var(--flag); }
  .side progress::-moz-progress-bar { background: var(--flag); }
  .side.enemy { --flag: #ffad8b; }
  .side.ally { --flag: #b9b6ff; }
  .line-status { display: grid; justify-items: center; gap: 3px; }
  #phase { display: block; padding: 4px 9px; color: #e4d9fc; background: #40375b; border-radius: 6px; white-space: nowrap; font-size: 11px; font-weight: 800; }
  #phase.engaged { background: #f3d67f; color: #402d3a; }
  #time { font: 700 13px/1.25 var(--mono); color: #e3dced; }
  .arena { position: relative; min-width: 0; isolation: isolate; background: #212436; }
  #field { width: 100%; height: auto; display: block; image-rendering: pixelated; }
  .outcome {
    position: absolute; inset: 0; display: grid; place-content: center; gap: 12px; justify-items: center;
    font-size: clamp(26px, 5vw, 58px); background: #2017339c; color: #fff4d7; font-weight: 800;
  }
  .caption { display: flex; gap: 7px 13px; flex-wrap: wrap; justify-content: space-between; padding: 8px 15px; align-items: center; background: #2a2741; border-top: 1px solid #4b465b; color: #e4ddeb; font-size: 11px; line-height: 1.45; }
  .caption span:first-child { color: #fae2a1; font-weight: 700; }
  .below { display: grid; grid-template-columns: minmax(0, 1.65fr) minmax(270px, 1fr); gap: 13px; margin-top: 13px; align-items: start; }
  .panel { background: var(--sheet); border: 1px solid var(--rule); border-radius: 13px; padding: 12px; min-width: 0; }
  .panel h2 { font-size: 16px; font-weight: 800; }
  .panel-head { display: flex; align-items: baseline; justify-content: space-between; gap: 6px 12px; flex-wrap: wrap; margin-bottom: 8px; }
  .bank { color: #4a3b72; font: 700 13px/1.4 var(--mono); white-space: nowrap; }
  .bank span { color: var(--muted); font: 700 11px/1.4 "Yu Gothic UI", "Meiryo", sans-serif; }
  .deck { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; list-style: none; padding: 0; }
  .card { min-width: 0; }
  .unit-card {
    position: relative; width: 100%; height: 100%; min-height: 116px; overflow: hidden;
    border: 1px solid #e8dfef; border-radius: 8px; background: #fbf8fd; padding: 5px 6px 6px; text-align: left;
  }
  .unit-card:not(:disabled):hover { border-color: #9074c9; background: #f2eafa; }
  .unit-card.ready { border-color: #9173d1; }
  .portrait {
    display: grid; justify-items: center; width: 100%; height: 54px;
    background: radial-gradient(circle, #7a629a40 1px, transparent 1.25px) center / 11px 11px, var(--tint, #f0eaf7);
    border-radius: 5px; overflow: hidden; position: relative;
  }
  .portrait canvas { position: absolute; inset: 2px 14%; width: 72%; height: calc(100% - 4px); object-fit: contain; image-rendering: pixelated; pointer-events: none; }
  .cost { position: absolute; right: 7px; top: 7px; background: #fffaf2; color: #735330; border-radius: 5px; padding: 2px 4px; font: 700 10px/1.3 var(--mono); }
  .card strong { display: block; margin-top: 3px; font-size: 12px; overflow-wrap: anywhere; line-height: 1.2; }
  .card-role { display: block; color: #5a4a74; font-size: 10px; margin-top: 3px; }
  .card-status { display: block; font-size: 10px; color: var(--muted); margin-top: 4px; line-height: 1.3; }
  .unit-card.ready .card-status { color: #4a36ba; font-weight: 800; }
  .enemy-deck { margin-top: 8px; }
  .enemy-deck summary { cursor: pointer; color: var(--muted); font-size: 11px; font-weight: 700; }
  .enemy-deck .deck { margin-top: 6px; }
  .log { list-style: none; padding: 0; display: grid; gap: 4px; }
  .log li { display: grid; grid-template-columns: 42px minmax(0, 1fr); gap: 2px; color: #554e66; font-size: 11px; line-height: 1.4; }
  .log time { color: var(--muted); font: 700 11px/1.4 var(--mono); }
  .log .enemy-event span { color: #895043; }
  .log .ally-event span { color: #4c3897; }
  .last-hit { min-height: 39px; margin: 0 0 8px; padding: 7px 8px; background: #f6f1fa; color: #4c405d; border-radius: 6px; font-size: 11px; line-height: 1.5; }
  .last-hit b { color: var(--ink); font-weight: 800; }
  .role-usage { color: var(--muted); font-size: 11px; line-height: 1.5; margin-bottom: 7px; }
  .role-table { margin-top: 11px; }
  .role-table summary { cursor: pointer; font-size: 13px; font-weight: 800; }
  .table-wrap { overflow: auto; }
  table { width: 100%; margin-top: 8px; border-collapse: collapse; font-size: 12px; text-align: left; }
  th, td { padding: 6px; border-bottom: 1px solid #e8e0ed; white-space: nowrap; }
  th { color: #504366; background: #f4eef9; }
  .effects { margin-top: 10px; display: flex; align-items: center; gap: 7px 11px; flex-wrap: wrap; padding-block: 8px; }
  .effects h2 { font-size: 14px; }
  #impact-buttons { display: flex; flex-wrap: wrap; gap: 4px; }
  .impact { border: 1px solid #e4dce9; border-radius: 7px; padding: 4px 7px; background: #faf7fc; min-height: 31px; color: #4d4162; font-size: 11px; font-weight: 700; white-space: nowrap; }
  .impact:hover { border-color: #a894cf; color: var(--purple); }
  .impact i { display: inline-block; width: 8px; height: 8px; margin-right: 5px; background: var(--trace); transform: rotate(45deg); border: 1px solid #544363; }
  @media (max-width: 850px) {
    .below { grid-template-columns: minmax(0, 1fr); }
    .intro { align-items: start; }
  }
  @media (max-width: 555px) {
    .bar .wrap { flex-wrap: wrap; gap: 6px; padding-block: 8px; min-height: 56px; }
    .brand { font-size: 15px; }
    .key { width: 26px; height: 25px; font-size: 14px; }
    .nav a { font-size: 10px; padding: 6px; }
    .intro { flex-wrap: wrap; padding-block: 14px 11px; }
    .intro p { font-size: 12px; }
    .plans { gap: 5px; }
    .plans label { flex: 1 1 100px; min-width: 0; }
    .plans select { min-width: 0; width: 100%; padding-inline: 5px; font-size: 11px; }
    .hud { gap: 7px; padding: 8px 8px; }
    .side h2 { font-size: 11px; }
    .side output { font-size: 11px; }
    .side-head { display: grid; gap: 2px; }
    .caption { padding-inline: 7px; gap: 4px 7px; }
    .panel { padding: 8px; }
    .deck { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .card strong { font-size: 11px; }
  }
</style>
</head>
<body>
<header class="bar"><div class="wrap">
  <div class="brand"><span class="key" aria-hidden="true">打</span>打鍵戦線</div>
  <nav class="nav" aria-label="ページ">
    <a href="japan-stage-map.html">日本マップ</a>
    <a href="formation-demo.html">編成</a>
    <a href="battle-demo.html" aria-current="page">バトル</a>
  </nav>
</div></header>
<main class="wrap">
  <header class="intro">
    <div><h1>バトルデモ</h1><p>草丘の関所 / 10レーン</p></div>
    <div class="tools" role="group" aria-label="バトルの操作">
      <button class="button primary" id="pause" type="button" disabled>一時停止</button>
      <label>速度 <select id="speed"><option value=".5">0.5×</option><option value="1" selected>1×</option><option value="2">2×</option><option value="4">4×</option></select></label>
      <button class="button" id="reset" type="button" disabled>最初から</button>
    </div>
  </header>
  <section class="panel settings" aria-label="対戦条件">
    <div class="plans">
      <label>味方の編成<select id="ally-plan" disabled></select></label>
      <label>敵の編成<select id="enemy-plan" disabled></select></label>
      <label>味方の出撃<select id="deploy-mode" disabled><option value="auto">自動</option><option value="manual">手動</option></select></label>
    </div>
    <details class="custom">
      <summary>味方の編成をカスタマイズ</summary>
      <div class="custom-fields" id="custom-fields"></div>
      <p id="custom-error" role="status" hidden></p>
    </details>
  </section>
  <section class="stage" aria-label="戦場">
    <div class="hud">
      <div class="side enemy">
        <div class="side-head"><h2>左上の敵拠点</h2><output id="enemy-hp" aria-label="敵拠点のHP"></output></div>
        <progress id="enemy-bar" aria-label="敵拠点の残り体力"></progress>
      </div>
      <div class="line-status"><strong id="phase">準備中</strong><time id="time">00:00</time></div>
      <div class="side ally">
        <div class="side-head"><h2>右下の味方拠点</h2><output id="ally-hp" aria-label="味方拠点のHP"></output></div>
        <progress id="ally-bar" aria-label="味方拠点の残り体力"></progress>
      </div>
    </div>
    <figure class="arena">
      <canvas id="field" width="1280" height="535" aria-label="クオータービューの戦場"></canvas>
      <div class="outcome" id="outcome" hidden><span id="winner"></span><button type="button" class="button primary" id="again">もう一度</button></div>
    </figure>
    <div class="caption"><span id="line-caption">会敵すると全レーンの前線が固定</span><span id="army-count">敵 0体 ／ 味方 0体</span></div>
  </section>
  <section class="panel effects" aria-labelledby="effects-title">
    <h2 id="effects-title">相性エフェクトの見本</h2>
    <div id="impact-buttons" role="group" aria-label="相性ごとのエフェクトを再生"></div>
  </section>
  <div class="below">
    <section class="panel" aria-labelledby="deploy-title">
      <div class="panel-head"><h2 id="deploy-title">味方の出撃</h2><p class="bank"><span>コスト</span> <output id="ally-cost"></output> <span id="income"></span></p></div>
      <ul class="deck" id="ally-deck"></ul>
      <details class="enemy-deck">
        <summary id="enemy-deck-label">敵の編成</summary>
        <ul class="deck" id="enemy-deck"></ul>
      </details>
    </section>
    <section class="panel" aria-labelledby="log-title">
      <div class="panel-head"><h2 id="log-title">戦況</h2><p class="bank"><span>敵コスト</span> <output id="enemy-cost"></output></p></div>
      <p id="last-hit" class="last-hit">会敵すると最新の一撃がここに表示されます。</p>
      <p id="role-usage" class="role-usage"></p>
      <ul class="log" id="events"></ul>
    </section>
  </div>
  <details class="panel role-table">
    <summary>10役割の能力値</summary>
    <div class="table-wrap" tabindex="0" role="region" aria-label="10役割の能力値">
      <table>
        <thead><tr><th scope="col">役割</th><th scope="col">体力</th><th scope="col">威力</th><th scope="col">射程</th><th scope="col">移動速度</th><th scope="col">攻撃後の待ち</th><th scope="col">出撃費</th><th scope="col">再出撃</th><th scope="col">特徴</th></tr></thead>
        <tbody id="roles"></tbody>
      </table>
    </div>
  </details>
  <noscript><p>戦場の表示にはJavaScriptが必要です。</p></noscript>
</main>
<script id="battle-art" type="application/json">%%ART%%</script>
<script id="battle-engine">
%%SIMULATION%%
</script>
<script>
%%VIEW%%
</script>
</body>
</html>
