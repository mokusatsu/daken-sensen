<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#141c24">
  <title>打鍵戦線｜作戦本部</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="preview/headquarters.css">
  <link rel="stylesheet" href="preview/players.css">
  <link rel="stylesheet" href="preview/keyboard.css">
</head>
<body>
  <header class="mast">
    <div class="shell mast-inner">
      <a class="wordmark" href="#main" aria-label="打鍵戦線 作戦本部"><i class="keyboard-mark" aria-hidden="true"></i><span>打鍵戦線<small>DAKEN SENSEN</small></span></a>
      <nav aria-label="メインメニュー"><a href="#main" aria-current="page">作戦本部</a><a id="nav-map" aria-keyshortcuts="A" href="preview/japan-stage-map.html">戦区マップ</a><a id="nav-roster" aria-keyshortcuts="L" href="preview/character-roster.html">図鑑</a></nav>
      <div class="mast-tools"><span class="wallet" aria-label="所持経験値"><b>XP</b> <output id="hq-xp">0</output></span><button class="player-switch" aria-keyshortcuts="F" data-player-switch data-key-back aria-haspopup="dialog" hidden><strong data-player-name></strong><small>ユーザー切替</small></button><button class="sound-button" id="sound-settings" aria-label="サウンド設定" title="サウンド設定"><span class="sound-bars" aria-hidden="true"><i></i><i></i><i></i><i></i></span></button></div>
    </div>
  </header>
  <main class="shell" id="main">
    <nav class="fronts" aria-label="戦線マップ">
      <a id="front-japan" href="preview/japan-stage-map.html"><b>日本戦線</b><small id="japan-progress">0 / 47</small></a>
      <a id="front-usa" aria-disabled="true"><b>アメリカ戦線</b><small id="usa-progress">日本47拠点の制圧で解放</small></a>
    </nav>
    <section class="hero" aria-labelledby="title">
      <img id="target-scenery" class="hero-image" width="1440" height="480" alt="" decoding="async" fetchpriority="high">
      <div class="hero-content">
        <p class="theatre"><span></span><b id="front-name">日本戦線</b> <i>/</i> 拠点攻略</p>
        <h1 id="title">打鍵戦線</h1>
        <p class="objective">文字を打って部隊を送り出し、敵拠点を制圧せよ。</p>
        <div class="hero-actions"><a class="launch" id="launch" aria-keyshortcuts="S" data-key-start href="preview/japan-stage-map.html">前線へ出撃 <span aria-hidden="true">→</span></a><button class="how" id="open-help" aria-keyshortcuts="H">遊び方</button></div>
      </div>
      <div class="target-tab"><span class="target-mark" aria-hidden="true"></span><div><small id="target-index"></small><strong id="target-place"></strong><span id="target-landmark"></span></div></div>
    </section>
    <section class="war-status" aria-label="戦線の記録">
      <div class="campaign-progress"><div><span class="status-light"></span><strong id="clear-label">制圧した拠点</strong><b id="clear-stat">0 <small>/ 47</small></b></div><progress id="clear-meter" max="47" value="0" aria-label="制圧した拠点数"></progress></div>
      <div class="war-stat"><span>獲得勲章</span><b id="medal-stat">0</b></div><div class="war-stat"><span>仲間</span><b id="unit-stat">5</b></div>
      <button class="text-button" id="open-records" aria-keyshortcuts="G">戦績を見る <span aria-hidden="true">↗</span></button>
    </section>
    <div class="operations">
      <section class="squad-pane" aria-labelledby="squad-title">
        <header class="panel-top"><h2 id="squad-title"><i class="section-mark" aria-hidden="true"></i>出撃部隊</h2><a class="text-button" id="team-link" aria-keyshortcuts="D" href="preview/formation-demo.html">編成・育成 <span aria-hidden="true">→</span></a></header>
        <ul class="squad" id="squad"></ul>
      </section>
      <section class="drill-pane" aria-labelledby="drill-title">
        <div class="radar" aria-hidden="true"><i></i><b></b></div>
        <div class="drill-info"><p class="drill-label"><span></span>日替わり演習 <time id="drill-date"></time></p><h2 id="drill-title"></h2><p id="drill-brief">貸与部隊で挑む、90秒の拠点戦。</p>
        <a id="drill-link" aria-keyshortcuts=";" class="drill-action" href="preview/battle-demo.html">演習に出撃 <span aria-hidden="true">→</span></a></div>
      </section>
    </div>
    <noscript>ゲームを遊ぶにはJavaScriptを有効にしてください。</noscript>
  </main>
  <dialog id="hq-dialog" aria-labelledby="dialog-title"><header><h2 id="dialog-title"></h2><form method="dialog"><button class="close" aria-label="閉じる" autofocus>×</button></form></header><div class="dialog-body" id="dialog-body"></div></dialog>
  <script src="preview/campaign.js"></script><script src="preview/orders.js"></script><script src="preview/command-data.js"></script>
  <script src="preview/media/sfx/bank.js"></script><script src="preview/sound.js"></script>
  <template id="campaign-screen" data-players="home"><script src="preview/headquarters.js"></script></template>
  <script src="preview/keyboard.js"></script><script src="preview/players.js"></script>
</body>
</html>
